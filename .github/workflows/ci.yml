name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify backend
        working-directory: backend
        run: mvn -B verify

  secrets:
    # El proyecto trata sobre transporte seguro, asi que un keystore o un
    # certificado versionado por descuido seria el peor fallo posible. Este
    # trabajo falla si aparece material criptografico en el arbol.
    name: No committed key material
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail on committed keys or certificates
        shell: bash
        run: |
          encontrados=$(git ls-files | grep -E '\.(p12|jks|pem|key|crt|cer|pfx|keystore)$' || true)
          if [ -n "$encontrados" ]; then
            echo "Material criptografico versionado:"
            echo "$encontrados"
            exit 1
          fi
          echo "Sin material criptografico en el arbol."

      - name: Fail on hardcoded passwords in configuration
        shell: bash
        run: |
          # Se listan las lineas de contrasena y se descartan las que resuelven
          # por variable de entorno. Sin PCRE, para que el guardia sea igual de
          # verificable en local que en el runner.
          sospechosos=$(grep -rnE '^(server\.ssl\.[a-z-]*password|spring\.datasource\.password)='             --include='*.properties' --include='*.yml' . | grep -v '=\${' || true)
          if [ -n "$sospechosos" ]; then
            echo "Contrasenas literales en configuracion:"
            echo "$sospechosos"
            exit 1
          fi
          echo "Toda contrasena se resuelve por variable de entorno."
