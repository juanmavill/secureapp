spring.application.name=secureapp

# Default profile: plain HTTP, for local development and tests.
# Secure transport (TLS and mutual TLS) lives in the "tls" profile.
server.port=${SERVER_PORT:8080}

# Credentials for the single demonstration account.
# Only the BCrypt hash is stored, never the password. To generate a new one,
# see the "Credentials" section of the README.
# This hash belongs to a development password and must be replaced through the
# environment in any real deployment.
app.auth.username=${APP_AUTH_USERNAME:admin}
app.auth.password-hash=${APP_AUTH_PASSWORD_HASH:$2a$10$A1VoAZZ17jo4NbtlI1LcoeKcAIH1EsLmELxPLIm3KO0bC..JSBffG}

# Origins the browser is allowed to call from. Set through the environment in production.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
