spring.application.name=secureapp

# Perfil por defecto: HTTP plano, para desarrollo local y pruebas.
# El transporte seguro (TLS y TLS mutuo) vive en el perfil "tls".
server.port=${SERVER_PORT:8080}

# Credenciales de la unica cuenta de demostracion.
# Se almacena el hash BCrypt, nunca la contrasena. Para generar uno nuevo:
#   ver la seccion "Credenciales" del README.
# Este hash corresponde a una contrasena de desarrollo y debe sustituirse por
# entorno en cualquier despliegue real.
app.auth.username=${APP_AUTH_USERNAME:admin}
app.auth.password-hash=${APP_AUTH_PASSWORD_HASH:$2a$10$A1VoAZZ17jo4NbtlI1LcoeKcAIH1EsLmELxPLIm3KO0bC..JSBffG}

# Origenes autorizados para el navegador. En produccion se define por entorno.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
