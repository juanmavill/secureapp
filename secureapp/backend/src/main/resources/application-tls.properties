# Perfil de transporte seguro. Se activa con:
#   --spring.profiles.active=tls
#
# Ninguna propiedad trae valor por defecto: si falta una variable la aplicacion
# no arranca, en lugar de quedarse escuchando sin el material criptografico que
# se supone que debe usar.

server.port=${SERVER_PORT:8443}

# Certificado propio: identifica a este backend frente al proxy.
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:tomcat}

# TLS mutuo: el backend exige y valida el certificado de cliente que presenta
# Apache. client-auth=need rechaza la conexion si no llega certificado valido;
# con "want" la conexion se aceptaria igualmente y el control no existiria.
server.ssl.trust-store=${SSL_TRUSTSTORE_PATH}
server.ssl.trust-store-password=${SSL_TRUSTSTORE_PASSWORD}
server.ssl.trust-store-type=PKCS12
server.ssl.client-auth=need
