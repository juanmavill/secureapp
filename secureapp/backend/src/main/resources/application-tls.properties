# Secure transport profile. Enable it with:
#   --spring.profiles.active=tls
#
# No property carries a default: if a variable is missing the application refuses
# to start, rather than listening without the cryptographic material it is
# supposed to be using.

server.port=${SERVER_PORT:8443}

# Own certificate: identifies this backend to the proxy.
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:tomcat}

# Mutual TLS: the backend requires and validates the client certificate Apache
# presents. client-auth=need rejects the connection when no valid certificate
# arrives; with "want" the connection would be accepted anyway and the control
# would not exist.
server.ssl.trust-store=${SSL_TRUSTSTORE_PATH}
server.ssl.trust-store-password=${SSL_TRUSTSTORE_PASSWORD}
server.ssl.trust-store-type=PKCS12
server.ssl.client-auth=need
